# Generated by jayos-audio 2.0.0 for strength gentle; written again at
# every start of jayos-audio-denoise.service, so an edit here does not last.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { rtportal.enabled = false }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Microphone (noise suppressed)"
            media.name       = "Microphone (noise suppressed)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = df
                        plugin = "/usr/lib/ladspa/libdeep_filter_ladspa.so"
                        label  = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)"            = 24.0
                            "Min processing threshold (dB)"     = -15.0
                            "Max ERB processing threshold (dB)" = 30.0
                            "Max DF processing threshold (dB)"  = 20.0
                            "Min Processing Buffer (frames)"    = 2
                            "Post Filter Beta"                  = 0.02
                        }
                    }
                ]
            }
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name    = "jayos_denoise_capture"
                node.passive = true
            }
            playback.props = {
                node.name    = "jayos_denoise_source"
                media.class  = Audio/Source
            }
        }
    }
]

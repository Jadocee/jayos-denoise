# A floor under how small a PulseAudio client's recording cycle may be.
#
# Installed by jayos-audio as
# /usr/share/pipewire/pipewire-pulse.conf.d/60-jayos-capture-latency.conf --
# JayOS shipped it in ~/.config until jayos-audio 2.0.0. pipewire-pulse reads it
# when it starts; `jayos-audio floor apply`, which JayOS's install runs,
# restarts one that started before this file changed where no application has
# a stream open, and otherwise says what to run.
#
# WHY. A voice call in Element -- Chromium or Electron with WebRTC's audio
# processing on, as Discord, Slack and the browsers are -- records in 10 ms
# fragments (media/webrtc/audio_processor.cc: "require 10ms buffers to avoid
# rebuffering", read through a page summary). pipewire-pulse makes a recording
# stream's latency its fragment (fix_record_buffer_attr in
# src/modules/module-protocol-pulse/pulse-server.c, read in PipeWire's source
# at 8fe27cc), 480 frames at 48 kHz, and PipeWire rounds a requested quantum
# down to a power of two (clock.power-of-two-quantum, true by default,
# pipewire.conf(5)): 256 frames, 5.3 ms, for the microphone's whole graph.
#
# With EasyEffects' Effects switch on, every plugin in both its pipelines --
# the microphone's, a bypassed DeepFilterNet included, and the output preset's
# -- runs in EasyEffects' one data thread (context.num-data-loops is 1,
# pipewire.conf(5)), which serves the microphone's graph and the speakers'
# on their two clocks. At 5.3 ms a cycle that thread is late for now and then
# is a gap in what the call hears: the microphone stuttering with the switch
# on and clean with it off, whether noise suppression is on or not, reported
# by the owner on 2026-11-05. EasyEffects issue #5284 is the same interference
# the other way round, input effects stuttering the output, traced to a
# 256-frame cycle a pulse client forced and fixed by a floor like this one.
# docs/AUDIO.md, *The microphone stuttering in calls*, has the rest.
#
# WHY pulse.min.frag, AND 1024. A recording's latency is its fragment, clamped
# up to pulse.min.frag (the same function), so this raises recordings and
# nothing else: playback, and so a game's latency, keeps pipewire-pulse's own
# floor. 1024 frames is PipeWire's default quantum (default.clock.quantum), so
# a call's microphone runs at the cycle it would have had with nobody asking
# for less, and it is the quantum at which this package's patched plugin held
# 50.7 ms and had no underrun in a minute, where at 256 it had an overload
# episode (README.md, 2026-11-04). The cost is 21.3 ms of recording
# latency in place of 10, which a call's jitter buffer is far larger than.
#
# AT 60. Drop-ins are merged in the order of their names, across
# /usr/share/pipewire, /etc/pipewire and ~/.config/pipewire, and a later key
# wins (pipewire.conf(5), DROP-IN CONFIGURATION FILES). A file of your own
# named after this one, custom.conf for one, sets pulse.min.frag over it.
#
# NOT RUN: no pipewire-pulse reading this file on an Arch machine, and no call.
# tests/shell/test-floor.sh holds the file to its one key and, where a
# PipeWire is installed, starts one in a box and reads the latency a 10 ms
# recording is given with this file and without it.

pulse.properties = {
    pulse.min.frag = 1024/48000
}

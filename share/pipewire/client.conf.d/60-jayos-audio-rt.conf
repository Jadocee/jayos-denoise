# Real time from rtkit itself, not through xdg-desktop-portal, for every
# native PipeWire client -- EasyEffects among them, whose one data thread runs
# every effect.
# PipeWire's module-rt tries the portal first (rtkit_get_bus in
# src/modules/module-rt.c, read): a portal started before rtkit was installed
# reports a real-time budget of zero, which module-rt applies as a hard
# RLIMIT_RTTIME of 0 while rtkit still makes the thread real time, and the
# kernel kills the process once audio runs. Without rtkit at all, audio threads
# run at the scheduler's pleasure and miss cycles under load. jayos-audio
# depends on rtkit, which Arch's pipewire does not. The same setting as
# omarchy's etc/pipewire/client.conf.d/50-omarchy-rtkit.conf. Flatpak
# applications read their runtime's own configuration and are not affected.
module.rt.args = {
    rtportal.enabled = false
}

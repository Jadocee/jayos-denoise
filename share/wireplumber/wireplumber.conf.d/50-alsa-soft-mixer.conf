# Software volume for ALSA devices.
#
# Installed by jayos-audio as
# /usr/share/wireplumber/wireplumber.conf.d/50-alsa-soft-mixer.conf -- JayOS
# shipped it in ~/.config until jayos-audio 2.0.0. WirePlumber reads it as it
# starts; a drop-in of your own named after it, in /etc/wireplumber or
# ~/.config/wireplumber, sets api.alsa.soft-mixer over it.
#
# Some codecs -- Realtek in particular -- expose a hardware mixer whose steps
# are uneven or whose top of range is attenuated, so audio sounds muffled or
# the usable volume collapses into part of the slider. Doing the mixing in
# software sidesteps the hardware path entirely and behaves the same across
# every card.
#
# Scoped to alsa_card only. Bluetooth keeps hardware volume
# (bluez5.enable-hw-volume in JayOS's 51-bluez-headset.conf): a headset's own
# buttons should move the same control the slider does, and doubling software
# and hardware attenuation is what collapses the range there.
#
# Taken from omarchy's default/wireplumber config.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
